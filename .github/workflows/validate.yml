name: Validate Project Structure

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository contents
        run: |
          pwd
          ls -la
          find . -maxdepth 2 -type f | sort

      - name: Validate required directories
        run: |
          test -d "./evidence"
          test -d "./generated_data"
          test -d "./extracted_artifacts"
          test -d "./hashes"
          test -d "./chain_of_custody"
          test -d "./crypto"
          test -d "./scripts"
          test -d "./screenshots"
          test -d "./report"

      - name: Validate required files
        run: |
          test -f "./README.md"
          test -f "./scripts/calculate_hashes.py"
          test -f "./scripts/verify_hashes.py"
          test -f "./scripts/forensic_search.py"
          test -f "./scripts/metadata_analysis.py"
          test -f "./scripts/email_extraction.py"
          test -f "./scripts/dictionary_simulation.py"
          test -f "./hashes/sha256_hashes.txt"
          test -f "./chain_of_custody/chain_of_custody.csv"
          test -f "./crypto/phantom_protected.zip"
          test -f "./report/Operation_Phantom_Swipe_Technical_Legal_Report.docx"

      - name: Validation successful
        run: echo "Operation Phantom Swipe repository structure is valid."
